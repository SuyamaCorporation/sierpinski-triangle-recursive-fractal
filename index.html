<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sierpiński Triangle</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #050508; }
  input[type=range] { accent-color: #a855f7; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center text-gray-100">
<h1 class="text-2xl font-bold text-purple-400 mt-4 mb-2 tracking-wide">Sierpiński Triangle Fractal</h1>
<div class="flex flex-col md:flex-row gap-4 w-full max-w-4xl px-4 pb-6">
  <div class="flex-1 flex flex-col items-center">
    <canvas id="c" class="rounded-xl border border-purple-900 shadow-2xl" style="max-width:100%;"></canvas>
    <div class="mt-3 flex gap-6 text-sm text-gray-400">
      <div>Area remaining: <span id="areaFormula" class="text-purple-300 font-mono">(3/4)⁰ = 1</span></div>
      <div>Triangles filled: <span id="fillCount" class="text-purple-300 font-mono">1</span></div>
    </div>
  </div>
  <div class="md:w-52 flex flex-col gap-4 bg-gray-900 rounded-xl p-4 border border-gray-700">
    <div>
      <label class="text-xs text-gray-400 uppercase tracking-wider">Depth: <span id="depthVal" class="text-purple-300">5</span></label>
      <input type="range" id="depthSlider" min="1" max="10" value="5" class="w-full mt-1">
    </div>
    <button id="animBtn" class="bg-purple-700 hover:bg-purple-600 text-white font-semibold py-2 rounded-lg transition">Animate 1→10</button>
    <button id="exportBtn" class="bg-gray-700 hover:bg-gray-600 text-white text-sm py-2 rounded-lg transition">Export PNG</button>
    <div class="border-t border-gray-700 pt-3 text-xs text-gray-500 space-y-2">
      <p class="font-semibold text-gray-400">Area Formula</p>
      <p>At depth <span id="depthInFormula" class="text-purple-300">n</span>:</p>
      <p class="font-mono text-purple-300">A(n) = (3/4)ⁿ</p>
      <p>Remaining area converges to 0 as n→∞</p>
    </div>
    <div class="border-t border-gray-700 pt-3 text-xs text-gray-500">
      <p class="font-semibold text-gray-400 mb-2">Color Legend</p>
      <div id="colorLegend" class="space-y-1"></div>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const depthSlider = document.getElementById('depthSlider');
const depthVal = document.getElementById('depthVal');
const areaFormula = document.getElementById('areaFormula');
const fillCount = document.getElementById('fillCount');
const depthInFormula = document.getElementById('depthInFormula');
const colorLegend = document.getElementById('colorLegend');

let W, H, animTimer = null, animRunning = false;

function resize() {
  const w = Math.min(canvas.parentElement.clientWidth, 650);
  W = canvas.width = w;
  H = canvas.height = Math.round(w * 0.9);
}
resize();
window.addEventListener('resize', () => { resize(); drawFractal(parseInt(depthSlider.value)); });

function hslToHex(h, s, l) {
  h /= 360; s /= 100; l /= 100;
  const a = s * Math.min(l, 1-l);
  const f = n => { const k = (n + h*12) % 12; return l - a * Math.max(-1, Math.min(k-3, 9-k, 1)); };
  return '#' + [f(0),f(8),f(4)].map(x => Math.round(x*255).toString(16).padStart(2,'0')).join('');
}

function getColor(depth, maxDepth) {
  const hue = (depth / maxDepth) * 300 + 40;
  const sat = 80 + depth * 2;
  const lig = 45 + (depth / maxDepth) * 20;
  return hslToHex(hue % 360, Math.min(sat, 100), lig);
}

let triangleCount = 0;

function drawTriangle(ax, ay, bx, by, cx, cy, depth, maxDepth) {
  if (depth === 0) {
    ctx.fillStyle = getColor(maxDepth - depth, maxDepth);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();
    triangleCount++;
    return;
  }
  const abx = (ax + bx) / 2, aby = (ay + by) / 2;
  const bcx = (bx + cx) / 2, bcy = (by + cy) / 2;
  const cax = (cx + ax) / 2, cay = (cy + ay) / 2;

  ctx.fillStyle = '#050508';
  ctx.beginPath();
  ctx.moveTo(abx, aby);
  ctx.lineTo(bcx, bcy);
  ctx.lineTo(cax, cay);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = getColor(maxDepth - depth, maxDepth);
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.lineTo(cx, cy);
  ctx.closePath();
  ctx.fill();

  drawTriangle(ax, ay, abx, aby, cax, cay, depth - 1, maxDepth);
  drawTriangle(abx, aby, bx, by, bcx, bcy, depth - 1, maxDepth);
  drawTriangle(cax, cay, bcx, bcy, cx, cy, depth - 1, maxDepth);
}

function drawFractal(depth) {
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);

  const margin = W * 0.05;
  const side = W - margin * 2;
  const h = side * Math.sqrt(3) / 2;
  const ax = W / 2, ay = (H - h) / 2 + 5;
  const bx = W / 2 - side / 2, by = ay + h;
  const cx = W / 2 + side / 2, cy = by;

  triangleCount = 0;
  ctx.fillStyle = getColor(0, depth);
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.lineTo(cx, cy);
  ctx.closePath();
  ctx.fill();

  drawTriangle(ax, ay, bx, by, cx, cy, depth, depth);

  const area = Math.pow(3/4, depth).toFixed(6);
  const pct = (parseFloat(area) * 100).toFixed(4);
  areaFormula.textContent = `(3/4)^${depth} ≈ ${area} (${pct}%)`;
  fillCount.textContent = ((Math.pow(3, depth + 1) - 1) / 2).toLocaleString();
  depthInFormula.textContent = depth;
  updateLegend(depth);
}

function updateLegend(maxDepth) {
  const steps = Math.min(maxDepth + 1, 6);
  colorLegend.innerHTML = '';
  for (let d = 0; d <= maxDepth && d < steps; d++) {
    const color = getColor(d, maxDepth);
    colorLegend.innerHTML += `<div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-sm inline-block" style="background:${color}"></span>
      <span>Level ${d}</span>
    </div>`;
  }
  if (maxDepth >= steps) {
    colorLegend.innerHTML += `<div class="text-gray-600">…and more</div>`;
  }
}

depthSlider.addEventListener('input', function() {
  const d = parseInt(this.value);
  depthVal.textContent = d;
  if (!animRunning) drawFractal(d);
});

document.getElementById('animBtn').addEventListener('click', function() {
  if (animRunning) {
    clearTimeout(animTimer);
    animRunning = false;
    this.textContent = 'Animate 1→10';
    return;
  }
  animRunning = true;
  this.textContent = 'Stop';
  let d = 1;
  function step() {
    depthSlider.value = d;
    depthVal.textContent = d;
    drawFractal(d);
    if (d < 10 && animRunning) {
      d++;
      animTimer = setTimeout(step, 500);
    } else {
      animRunning = false;
      document.getElementById('animBtn').textContent = 'Animate 1→10';
    }
  }
  step();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'sierpinski.png';
  a.href = canvas.toDataURL();
  a.click();
});

drawFractal(5);
</script>
</body>
</html>
